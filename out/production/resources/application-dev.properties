# Development Profile Configuration for auth-service
# Active when: SPRING_PROFILES_ACTIVE=dev
# ===== OAuth2 Configuration (Development) =====
app.oauth2.issuer-uri=http://localhost:8083
app.oauth2.token-validity-duration=3600
# ===== Security Configuration (Development) =====
# Allow all origins for development
app.security.cors.allowed-origins=*
app.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
app.security.cors.allowed-headers=*
app.security.cors.max-age=3600
# Enable detailed CORS
app.security.cors.allow-credentials=true
app.security.cors.exposed-headers=*
# Path Matcher (enabled for testing)
app.security.path-matcher.enabled=false
app.security.path-matcher.redis-cache-ttl-minutes=5
# ===== Logging (Development - DEBUG level) =====
logging.level.root=INFO
logging.level.ec.com.ecommerce=DEBUG
logging.level.ec.com.ecommerce.config=DEBUG
logging.level.ec.com.ecommerce.config.security.pathmatcher=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data.redis=DEBUG
# ===== Redis Configuration (Development) =====
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=5000
# ===== Spring Boot DevTools (Development) =====
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
