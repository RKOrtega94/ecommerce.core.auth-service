# Production Profile Configuration for auth-service
# Active when: SPRING_PROFILES_ACTIVE=production
# ===== OAuth2 Configuration (Production) =====
app.oauth2.issuer-uri=${OAUTH2_ISSUER_URI}
app.oauth2.token-validity-duration=900
# ===== Security Configuration (Production) =====
# Restrict origins for production
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.security.cors.max-age=3600
# Path Matcher (enable in production for fine-grained access control)
app.security.path-matcher.enabled=true
app.security.path-matcher.redis-cache-ttl-minutes=60
app.security.path-matcher.redis-failure-policy=DENY_ALL
# ===== Logging (Production - WARN/ERROR level) =====
logging.level.root=WARN
logging.level.ec.com.ecommerce=WARN
logging.level.ec.com.ecommerce.config=WARN
logging.level.ec.com.ecommerce.config.security.pathmatcher=WARN
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.data.redis=ERROR
# ===== Redis Configuration (Production - with failover) =====
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=15000
spring.data.redis.jedis.pool.max-active=20
spring.data.redis.jedis.pool.max-idle=10
spring.data.redis.jedis.pool.min-idle=5
# ===== Spring Boot Actuator (Production - restricted) =====
management.endpoints.web.exposure.include=health,metrics
management.endpoints.web.base-path=/actuator
management.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
