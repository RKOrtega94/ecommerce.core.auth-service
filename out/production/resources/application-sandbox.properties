# Sandbox Profile Configuration for auth-service
# Active when: SPRING_PROFILES_ACTIVE=sandbox
# ===== OAuth2 Configuration (Sandbox) =====
app.oauth2.issuer-uri=http://localhost:8083
app.oauth2.token-validity-duration=1800
# ===== Security Configuration (Sandbox) =====
# Restrict origins for sandbox
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://sandbox.local:4200
app.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.security.cors.max-age=3600
# Path Matcher (disabled for sandbox, can be enabled for testing)
app.security.path-matcher.enabled=false
app.security.path-matcher.redis-cache-ttl-minutes=30
# ===== Logging (Sandbox - INFO level) =====
logging.level.root=WARN
logging.level.ec.com.ecommerce=INFO
logging.level.ec.com.ecommerce.config=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.redis=INFO
# ===== Redis Configuration (Sandbox) =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=10000
# ===== Spring Boot Actuator (Sandbox - limited) =====
management.endpoints.web.exposure.include=health,info,metrics
