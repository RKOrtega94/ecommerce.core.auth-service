spring.application.name=auth-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
# ===== OAuth2 Configuration =====
# Issuer URI for JWT validation (can be overridden in profile-specific properties)
app.oauth2.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8083}
app.oauth2.token-endpoint=/oauth2/token
app.oauth2.authorize-endpoint=/oauth2/authorize
app.oauth2.jwks-uri=/.well-known/jwks.json
app.oauth2.revocation-endpoint=/oauth2/revoke
app.oauth2.token-validity-duration=3600
app.oauth2.refresh-token-validity-duration=2592000
# ===== Security Configuration =====
# CORS Settings
app.security.cors.allowed-origins=*
app.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.security.cors.allowed-headers=*
app.security.cors.allow-credentials=true
app.security.cors.max-age=3600
app.security.cors.exposed-headers=*
# CSRF Settings
app.security.csrf.enabled=false
# Permitted public endpoints
app.security.permitted-endpoints=/api/auth/**,/oauth2/**,/.well-known/jwks.json,/actuator/**,/health/**,/error,/v3/api-docs/**,/swagger-ui/**
# Path Matcher Configuration (optional, disabled by default)
app.security.path-matcher.enabled=false
app.security.path-matcher.redis-cache-ttl-minutes=60
app.security.path-matcher.redis-cache-key-prefix=path-matcher
app.security.path-matcher.redis-failure-policy=DENY_ALL
app.security.path-matcher.kafka-invalidation-topic=path-matcher-invalidation
app.security.path-matcher.kafka-consumer-group=path-matcher-cache-consumer
